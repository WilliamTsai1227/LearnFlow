name: Trigger auto deployment for learnflow-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/learnflow-backend-AutoDeployTrigger-e7fd605b-2888-4b52-a608-019685fdedde.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LEARNFLOWBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LEARNFLOWBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LEARNFLOWBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/deploy
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: learnflowbackendacr.azurecr.io
          registryUsername: ${{ secrets.LEARNFLOWBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LEARNFLOWBACKEND_REGISTRY_PASSWORD }}
          containerAppName: learnflow-backend
          resourceGroup: LearnFlow-frontend_group
          imageToBuild: learnflowbackendacr.azurecr.io/learnflow-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


