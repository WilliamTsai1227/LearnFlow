name: Trigger auto deployment for learnflow-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/learnflow-backend-AutoDeployTrigger-2d16521a-53fc-44bc-8b7f-4cfac6a9818b.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.LEARNFLOWBACKEND_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          # build context 為專案根目錄，dockerfilePath 相對於 appSourcePath
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: deploy/Dockerfile
          registryUrl: learnflowbackendacr.azurecr.io
          registryUsername: ${{ secrets.LEARNFLOWBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LEARNFLOWBACKEND_REGISTRY_PASSWORD }}
          containerAppName: learnflow-backend
          resourceGroup: LearnFlow-frontend_group
          imageToBuild: learnflowbackendacr.azurecr.io/learnflow-backend:${{ github.sha }}
          # uvicorn 跑在 8002（見 deploy/Dockerfile），對外開放供前端呼叫
          ingress: external
          targetPort: 8002
          
            

     

