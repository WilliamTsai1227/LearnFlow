<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
        color: #111827;
        background: #f6f8fc;
      }
      h1 { font-size: 16px; margin: 0 0 12px; }
      label { display: block; font-size: 12px; color: #677084; margin: 10px 0 4px; }
      input, select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #e4e9f2;
        border-radius: 8px;
        font-size: 13px;
        background: #fff;
        box-sizing: border-box;
      }
      .status {
        margin: 12px 0;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
      }
      .status.ok { background: #e7f7f1; color: #17b890; }
      .status.no { background: #fdeaea; color: #ef5757; }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 9px;
        border: 0;
        border-radius: 9px;
        background: #2f75ed;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      .link { display: inline-block; margin-top: 10px; font-size: 12px; color: #2f75ed; text-decoration: none; }
      .saved { font-size: 12px; color: #17b890; min-height: 14px; margin-top: 6px; }
      .hint {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #eef4ff;
        color: #3b567f;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>LearnFlow 沈浸式學習</h1>
    <div id="status" class="status no">檢查登入中…</div>

    <label for="apiBase">LearnFlow 網址</label>
    <input id="apiBase" type="text" placeholder="http://localhost" />

    <button id="save">儲存</button>
    <div id="saved" class="saved"></div>

    <div class="hint">
      語言、雙字幕、字幕大小等學習設定，請在 YouTube 播放器右下角的
      <strong>齒輪圖示</strong> 中調整。
    </div>

    <a id="openSite" class="link" href="#" target="_blank">前往 LearnFlow 登入 / 複習 →</a>

    <script src="popup.js"></script>
  </body>
</html>
