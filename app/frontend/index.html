<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LearnFlow — 情境學習</title>
    <script>
      // 未登入者不該先看到 app 外框、再被 auth.js 跳去登入頁（畫面會閃一下）。
      // localStorage 的 user 是 auth.js 在 refresh 成功後寫的登入快照：
      // 有快照就樂觀直接顯示；沒有就先遮住畫面，等 auth.js 問到結果再顯示或導向。
      //
      // 這裡不能直接導向登入頁：剛從 Google OAuth 導回來時 cookie 已經有了、
      // 但快照還沒寫入，直接導向會讓人永遠登不進來。
      (function () {
        var hasSnapshot = false;
        try {
          hasSnapshot = !!localStorage.getItem("user");
        } catch (e) {
          // 隱私模式讀不到 localStorage，當作沒有快照處理
        }
        if (hasSnapshot) return;

        var root = document.documentElement;
        root.classList.add("auth-pending");
        // 萬一 auth.js 沒載入或中途出錯，別讓畫面卡在空白
        setTimeout(function () {
          root.classList.remove("auth-pending");
        }, 5000);
      })();
    </script>
    <style>
      /* 認證未決前不繪製內容。寫在這裡而不是 styles.css，避免依賴外部檔案的載入順序 */
      html.auth-pending body { visibility: hidden; }
    </style>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <div class="sidebar-shell">
        <aside class="sidebar" id="sidebar" aria-label="主要導覽">
          <div class="sidebar-top">
            <a class="brand" href="/" aria-label="LearnFlow 首頁">
              <span class="brand-mark" aria-hidden="true"></span>
              <span class="brand-text">LearnFlow</span>
            </a>
          </div>

          <nav class="nav-list" id="navList" aria-label="功能選單"></nav>

          <section class="upgrade-card">
            <div class="upgrade-card-icon" aria-hidden="true">
              <i data-lucide="sparkles"></i>
            </div>
            <p class="eyebrow">升級到 Pro</p>
            <h2>解鎖更多功能，學習更有效率！</h2>
            <button type="button" class="dark-button upgrade-btn" disabled>升級方案</button>
          </section>
        </aside>

        <button
          type="button"
          class="sidebar-collapse-btn"
          id="sidebarCollapseBtn"
          aria-label="收合側邊欄"
          aria-expanded="true"
        >
          <i data-lucide="panel-left-close"></i>
        </button>
      </div>

      <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

      <main class="main-area">
        <header class="topbar">
          <div class="topbar-leading">
            <button
              type="button"
              class="sidebar-toggle-btn"
              id="sidebarToggleBtn"
              aria-label="開啟側邊選單"
              aria-expanded="false"
            >
              <i data-lucide="menu"></i>
            </button>
            <label class="search-box" for="searchInput">
              <i data-lucide="search"></i>
              <input
                id="searchInput"
                type="search"
                placeholder="搜尋課程 / 單字 / 句子"
                autocomplete="off"
                disabled
              />
            </label>
          </div>
          <div class="top-actions">
            <button type="button" class="icon-button" aria-label="通知" disabled>
              <i data-lucide="bell"></i>
            </button>
            <span id="apiStatus" class="tag api-tag">API</span>
            <div class="user-menu" id="user-menu-trigger">
              <button type="button" class="profile-chip" aria-label="使用者選單" aria-haspopup="true">
                <span class="avatar" id="user-avatar">U</span>
                <span class="profile-name" id="user-display-name">使用者</span>
                <i data-lucide="chevron-down"></i>
              </button>
              <div class="user-dropdown" id="user-dropdown">
                <div class="dropdown-header">
                  <span class="avatar" id="dropdown-avatar-char">U</span>
                  <div class="dropdown-user-info">
                    <span class="dropdown-name" id="user-display-name-dropdown">使用者</span>
                    <span class="dropdown-badge" id="user-tier-badge">Free</span>
                  </div>
                </div>
                <div class="dropdown-divider"></div>
                <button type="button" class="dropdown-item" id="menu-logout">
                  <i data-lucide="log-out"></i>
                  <span>登出</span>
                </button>
              </div>
            </div>
          </div>
        </header>

        <section id="viewRoot" class="view-root" aria-live="polite"></section>
      </main>
    </div>

    <nav class="mobile-tabbar" id="mobileTabbar" aria-label="行動版導覽"></nav>

    <div id="toastStack" class="toast-stack" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="/js/api-config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/saved.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/lesson.js"></script>
    <script src="/js/notes.js"></script>
    <script src="/js/vocab.js"></script>
    <script src="/js/review.js"></script>
    <script src="/js/captures.js"></script>
    <script src="/js/analytics.js"></script>
    <script>
      if (window.lucide) lucide.createIcons();
    </script>
  </body>
</html>
