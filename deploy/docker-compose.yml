# 請在專案根目錄執行（讀取 ../.env）：
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-learnflow}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnflow} -d ${POSTGRES_DB:-learnflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../app
      dockerfile: ../deploy/Dockerfile
    container_name: learnflow-backend
    restart: unless-stopped
    volumes:
      - ../app/backend:/app/backend:ro
      # 使用者上傳的筆記檔存到可寫入的具名 volume（程式碼目錄是唯讀掛載，不能寫）
      - notes_uploads:/data/uploads
    env_file:
      - ../.env
    environment:
      # DATABASE_URL 需指向 compose 內 postgres 服務名，不可直接用 ../.env 的 127.0.0.1
      DATABASE_URL: postgresql://${POSTGRES_USER:-learnflow}:${POSTGRES_PASSWORD:-learnflow_dev}@postgres:5432/${POSTGRES_DB:-learnflow}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      # 筆記上傳檔存放目錄（對應上方 notes_uploads volume）
      NOTES_UPLOAD_DIR: /data/uploads
      # Google OAuth / SECRET_KEY / FRONTEND_URL 等請只放在 ../.env（env_file）
      # 勿在此用 ${GOOGLE_CLIENT_ID:-} 覆写，否則 deploy/ 無 .env 時會變成空字串
    expose:
      - "8002"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: learnflow-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../app/frontend:/usr/share/nginx/frontend:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
    name: learnflow-postgres-data
  notes_uploads:
    name: learnflow-notes-uploads
