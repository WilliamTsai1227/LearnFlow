services:
  postgres:
    image: postgres:16-alpine
    container_name: learnflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-learnflow}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnflow} -d ${POSTGRES_DB:-learnflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../app
      dockerfile: ../deploy/Dockerfile
    container_name: learnflow-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-learnflow}:${POSTGRES_PASSWORD:-learnflow_dev}@postgres:5432/${POSTGRES_DB:-learnflow}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
    expose:
      - "8002"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: learnflow-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../app/frontend/html:/usr/share/nginx/html:ro
      - ../app/frontend/css:/usr/share/nginx/html/css:ro
      - ../app/frontend/js:/usr/share/nginx/html/js:ro
      - ../app/frontend/audio:/usr/share/nginx/html/audio:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
    name: learnflow-postgres-data
